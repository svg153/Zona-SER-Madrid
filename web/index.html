<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zona SER Madrid</title>

    <link rel="shortcut icon" href="favicon.png" />

    <meta name="description" content="Mapa con las diversas zonas SER de Madrid, con las plazas de cada tipo según datos del ayuntamiento."/>
    <meta name="author" content="Javier Jimenez Shaw" />

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet-src.js"></script>

	<link rel="stylesheet" href="https://unpkg.com/leaflet.control.layers.tree@1.0.0/L.Control.Layers.Tree.css" />
	<script src="https://unpkg.com/leaflet.control.layers.tree@1.0.0/L.Control.Layers.Tree.js"></script>

    <style type="text/css">
        html, body { width: 100%; height: 100%; margin: 0; }
        #map { width: 100%; height: 100%; }
        .text_barrio:not(:empty) { font-weight: bold; color: #773687; background-color: #ffff0050; padding: 0.2em 0.6em; border-radius: 5px; }
        .ser_legend { background: rgba(255, 255, 255, 0.96); padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,0.35); max-width: 260px; line-height: 1.25; }
        .ser_legend_item { display: flex; gap: 8px; align-items: flex-start; margin-top: 7px; }
        .ser_swatch { display: inline-block; width: 16px; height: 5px; margin-top: 6px; border-radius: 3px; flex: 0 0 16px; }
        .ser_legend_source { margin-top: 8px; padding-top: 7px; border-top: 1px solid #ddd; font-size: 11px; }
        .parking_marker { background: transparent; border: 0; }
        .municipal_park_ride_marker, .municipal_public_parking_marker { width: 32px; height: 32px; border-radius: 7px 7px 7px 2px; background: #fff; border: 2px solid #222; box-shadow: 0 1px 4px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; gap: 1px; font-family: system-ui, sans-serif; }
        .municipal_public_parking_marker { border-style: double; border-width: 4px; }
        .parking_marker_p { font-size: 18px; font-weight: 800; line-height: 1; }
        .parking_marker_transfer { font-size: 12px; font-weight: 700; line-height: 1; }
        @media (max-width: 700px) {
            .ser_legend { max-width: 200px; max-height: 40vh; overflow-y: auto; font-size: 12px; }
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="script.js"></script>
    <script src="parking-layers.js"></script>
    <script src="restriction-layers.js"></script>
</body>
</html>
