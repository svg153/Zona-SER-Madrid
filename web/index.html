<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zona SER Madrid</title>

    <link rel="shortcut icon" href="favicon.png" />

    <meta name="description" content="Mapa con las diversas zonas SER de Madrid, con las plazas de cada tipo según datos del ayuntamiento."/>
    <meta name="author" content="Javier Jimenez Shaw" />

	<link rel="stylesheet" href="vendor/leaflet.css" />
	<script src="vendor/leaflet.js"></script>

	<link rel="stylesheet" href="vendor/L.Control.Layers.Tree.css" />
	<script src="vendor/L.Control.Layers.Tree.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@4.0.0/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder@4.0.0/dist/Control.Geocoder.js"></script>

    <style type="text/css">
        html, body { width: 100%; height: 100%; margin: 0; }
        #map { width: 100%; height: 100%; }
        .text_barrio:not(:empty) { font-weight: bold; color: #773687; background-color: #ffff0050; padding: 0.2em 0.6em; border-radius: 5px; }
        .ser_legend { background: rgba(255, 255, 255, 0.96); padding: 0; border-radius: 7px; box-shadow: 0 1px 5px rgba(0,0,0,0.35); max-width: 280px; line-height: 1.3; overflow: hidden; }
        .ser_legend_toggle { display: flex; width: 100%; min-height: 40px; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border: 0; background: transparent; color: #111; cursor: pointer; font: inherit; font-weight: 700; text-align: left; }
        .ser_legend_toggle:hover, .ser_legend_toggle:focus-visible { background: rgba(0, 0, 0, 0.055); outline: none; }
        .ser_legend_chevron { display: inline-block; font-size: 14px; line-height: 1; transition: transform 0.15s ease; }
        .ser_legend_body { padding: 0 12px 10px; }
        .ser_legend.is-collapsed .ser_legend_body { display: none; }
        .ser_legend.is-collapsed .ser_legend_chevron { transform: rotate(-90deg); }
        .ser_legend_item { display: flex; gap: 8px; align-items: flex-start; margin-top: 7px; }
        .ser_swatch { display: inline-block; width: 18px; height: 5px; margin-top: 6px; border-radius: 3px; flex: 0 0 18px; }
        .ser_legend_source { margin-top: 8px; padding-top: 7px; border-top: 1px solid #ddd; font-size: 11px; }
        .parking_marker { background: transparent; border: 0; }
        .municipal_park_ride_marker, .municipal_public_parking_marker, .regional_park_ride_marker { width: 32px; height: 32px; border-radius: 7px 7px 7px 2px; background: #fff; border: 2px solid #222; box-shadow: 0 1px 4px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; gap: 1px; font-family: system-ui, sans-serif; }
        .municipal_public_parking_marker { border-style: double; border-width: 4px; }
        .regional_park_ride_marker { border-radius: 50%; border-width: 3px; }
        .parking_marker_p { font-size: 18px; font-weight: 800; line-height: 1; }
        .parking_marker_transfer { font-size: 12px; font-weight: 700; line-height: 1; }

        .parking_search_control { background: rgba(255,255,255,0.97); border-radius: 7px; box-shadow: 0 1px 5px rgba(0,0,0,0.35); width: min(360px, calc(100vw - 70px)); overflow: hidden; font: 14px/1.35 system-ui, sans-serif; }
        .parking_search_toggle { width: 100%; min-height: 40px; padding: 9px 12px; border: 0; background: transparent; text-align: left; font: inherit; font-weight: 700; cursor: pointer; }
        .parking_search_body { padding: 0 10px 10px; }
        .parking_search_control.is-collapsed .parking_search_body { display: none; }
        .parking_search_row label { display: block; font-weight: 650; margin-top: 6px; }
        .parking_search_row input { box-sizing: border-box; width: 100%; margin-top: 4px; min-height: 36px; padding: 7px 9px; border: 1px solid #aaa; border-radius: 5px; font: inherit; }
        .parking_search_actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
        .parking_search_actions button, .parking_search_results button { min-height: 34px; border: 1px solid #aaa; border-radius: 5px; background: #fff; padding: 5px 8px; cursor: pointer; font: inherit; }
        .parking_search_origin { margin-top: 8px; }
        .parking_search_origin summary { cursor: pointer; font-weight: 650; }
        .parking_search_results { display: grid; gap: 4px; margin-top: 6px; }
        .parking_search_results button { text-align: left; }
        .parking_search_status { min-height: 18px; margin-top: 7px; font-size: 12px; color: #444; }

        .parking_occupancy { margin-top: 8px; padding-top: 7px; border-top: 1px solid #ddd; }
        .parking_occupancy_available strong { color: #177245; }
        .parking_occupancy_full strong { color: #a40000; }
        .parking_occupancy_stale strong, .parking_occupancy_no_data strong { color: #7a5d00; }
        .parking_occupancy_unavailable strong, .parking_occupancy_unmatched strong { color: #666; }

        .recommendation-sheet { width: min(440px, calc(100vw - 64px)); margin: 0 0 12px 10px; font: 14px/1.4 system-ui, sans-serif; }
        .recommendation-sheet details { max-height: 48vh; display: block; overflow: hidden; background: rgba(255,255,255,.98); border: 1px solid #bfc7cc; border-radius: 16px; box-shadow: 0 4px 22px rgba(16,34,44,.24); }
        .recommendation-sheet details[open] { max-height: min(58vh, 620px); }
        .recommendation-sheet summary { position: sticky; top: 0; z-index: 2; min-height: 48px; padding: 8px 14px; display: flex; background: #fff; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-weight: 750; list-style-position: inside; }
        .recommendation-sheet summary small { font-weight: 500; color: #52616a; text-align: right; }
        .recommendation-body { max-height: calc(58vh - 64px); padding: 4px 14px 14px; overflow-y: auto; overscroll-behavior: contain; }
        .recommendation-body label { display: block; margin: 3px 0 5px; font-weight: 650; }
        .recommendation-body select, .recommendation-body button { min-height: 44px; border: 1px solid #7b8b94; border-radius: 9px; background: white; padding: 8px 12px; font: inherit; }
        .recommendation-body select { width: 100%; margin-bottom: 8px; }
        .recommendation-body > button { width: 100%; color: white; background: #183f4d; border-color: #183f4d; font-weight: 700; }
        .recommendation-body > button:disabled { opacity: .52; }
        #recommendation-status { min-height: 1.5em; color: #43555e; font-size: 12px; }
        .recommendation-card { padding: 12px 0; border-top: 1px solid #d8dfe2; }
        .recommendation-kicker { color: #9d3c24; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
        .recommendation-card h3 { margin: 4px 0; font-size: 16px; }
        .recommendation-kind { color: #334f5c; font-size: 12px; font-weight: 700; }
        .recommendation-card p { margin: 6px 0; }
        .recommendation-card dl { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; margin: 10px 0; }
        .recommendation-card dl div { padding: 7px; background: #f0f4f5; border-radius: 8px; }
        .recommendation-card dt { color: #52616a; font-size: 11px; }
        .recommendation-card dd { margin: 2px 0 0; font-size: 12px; font-weight: 700; }
        .recommendation-warning { padding: 8px; background: #fff0d5; border-left: 3px solid #a15a00; border-radius: 5px; font-size: 12px; }
        .recommendation-note, .recommendation-disclaimer, .recommendation-empty { color: #52616a; font-size: 12px; }
        .recommendation-actions { display: flex; align-items: center; gap: 14px; }
        .recommendation-actions a { color: #14566a; font-weight: 650; }
        .recommendation-disclaimer { margin-bottom: 0; }
        @media (max-width: 700px) {
            .recommendation-sheet { width: min(430px, calc(100vw - 64px)); margin: 0 0 8px 6px; }
            .recommendation-sheet details[open] { max-height: min(55vh, 520px); }
            .recommendation-body { max-height: calc(55vh - 64px); }
            .recommendation-sheet summary { min-height: 50px; padding: 8px 12px; }
            .recommendation-card dl { grid-template-columns: 1fr 1fr; }
            .recommendation-card dl div:last-child { grid-column: 1 / -1; }
        }
        .leaflet-control-layers-expanded { max-height: min(72vh, 640px); overflow-y: auto; }
        @media (max-width: 700px) {
            .ser_legend { max-width: min(250px, calc(100vw - 28px)); font-size: 14px; }
            .ser_legend.is-collapsed { max-width: min(220px, calc(100vw - 28px)); }
            .ser_legend_toggle { min-height: 44px; padding: 10px 13px; font-size: 15px; }
            .ser_legend_body { max-height: 45vh; overflow-y: auto; padding: 0 13px 12px; }
            .ser_legend_item { gap: 10px; margin-top: 9px; }
            .ser_legend_item small { font-size: 12.5px; line-height: 1.3; }
            .ser_swatch { width: 20px; flex-basis: 20px; }
            .ser_legend_source { font-size: 12px; }
            .parking_search_control { width: min(300px, calc(100vw - 76px)); font-size: 14px; }
            .parking_search_toggle { min-height: 44px; font-size: 15px; }
            .parking_search_body { max-height: 58vh; overflow-y: auto; }
            .parking_search_actions button { min-height: 38px; }
            .leaflet-control-layers-expanded { max-width: 82vw; max-height: 64vh; font-size: 12px; }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="runtime-config.js?v=20261028-occupancy"></script>
    <script src="layer-state.js"></script>
    <script src="script.js"></script>
    <script src="parking-ranking.js"></script>
    <script src="parking-candidates.js"></script>

    <script src="destination-search.js"></script>

    <script src="parking-occupancy.js"></script>


    <script src="parking-layers.js"></script>
    <script src="restriction-layers.js"></script>
    <script src="recommendations-panel.js"></script>
</body>
</html>
