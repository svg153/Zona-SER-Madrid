name: Weekly Data Update

on:
  schedule:
    # Cada lunes a las 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Permite ejecución manual

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    name: Update GeoJSON data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t zona-ser-update .

      - name: Update data
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            zona-ser-update \
            bash scripts/update-data.sh

      - name: Update ZBE restriction snapshots
        run: bash scripts/update-zbe.sh

      - name: Validate updated GeoJSON files
        id: validate
        run: |
          python3 scripts/validate_geojson.py \
            --web-dir web \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet web/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Data source may not have updated since last run."
            exit 0
          fi

          echo "changed=true" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

          DIFF_STATS=$(git diff --numstat web/)
          ADDITIONS=$(echo "$DIFF_STATS" | awk '{s+=$1} END {print s+0}')
          DELETIONS=$(echo "$DIFF_STATS" | awk '{s+=$2} END {print s+0}')
          FILES=$(git diff --name-only web/ | wc -l)

          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT

          TOTAL_LINES=$(git diff --stat web/ | tail -1 | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          if [ "$TOTAL_LINES" -gt 50000 ]; then
            echo "⚠️ WARNING: Large diff detected ($TOTAL_LINES insertions). Review manually."
            echo "large_diff=true" >> $GITHUB_OUTPUT
          else
            echo "large_diff=false" >> $GITHUB_OUTPUT
          fi

          echo "Diff stats: +$ADDITIONS / -$DELETIONS across $FILES files ($TOTAL_LINES insertions)"

      - name: Generate zone-level change report
        id: zone_report
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          REPORT_FILE="${RUNNER_TEMP}/zone-report.md"

          python3 scripts/zone_report.py \
            --web-dir web \
            --output "$REPORT_FILE" \
            --github-output "$GITHUB_OUTPUT"

          test -s "$REPORT_FILE"
          echo "Zone report generated: $REPORT_FILE"
          cat "$REPORT_FILE"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request if data changed
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update GeoJSON data from official Madrid sources (${{ steps.check_changes.outputs.date }})"
          title: "chore: weekly data update from official Madrid sources"
          body: |
            **Automated weekly data update**

            This PR contains updated GeoJSON data from official Madrid sources, including SER, municipal parking and ZBE boundaries.

            - Updated: ${{ steps.check_changes.outputs.date }}
            - Files: web/*.geojson
            - Changes: +${{ steps.check_changes.outputs.additions }} / -${{ steps.check_changes.outputs.deletions }} (${{ steps.check_changes.outputs.files }} files)
            - Total features: ${{ steps.validate.outputs.total_features }}

            **Validation**: ✅ All expected GeoJSON files valid

            **Zone Summary**:
            - Parking spaces by zone: ${{ steps.zone_report.outputs.total_spaces || 'see report below' }}
            - Crosses (inter-zone): ${{ steps.zone_report.outputs.total_crosses || 'see report below' }}
            - Parquímetros: ${{ steps.zone_report.outputs.parquimetros || 'N/A' }}

            ${{ steps.zone_report.outputs.report }}

            Please review and merge if changes are acceptable.
          branch: data/weekly-update
          delete-branch: true
          labels: automated-update
