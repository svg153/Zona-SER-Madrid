name: Weekly Data Update

on:
  schedule:
    # Cada lunes a las 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Permite ejecución manual

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t zona-ser-update .

      - name: Update data
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            zona-ser-update \
            bash scripts/update-data.sh

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet web/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
            # Calcular diff stats
            echo "additions=$(git diff --numstat web/ | awk '{s+=$1} END {print s+0}')" >> $GITHUB_OUTPUT
            echo "deletions=$(git diff --numstat web/ | awk '{s+=$2} END {print s+0}')" >> $GITHUB_OUTPUT
            echo "files=$(git diff --name-only web/ | wc -l)" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request if data changed
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update GeoJSON data from geoportal.madrid.es (${{ steps.check_changes.outputs.date }})"
          title: "chore: weekly data update from geoportal.madrid.es"
          body: |
            **Automated weekly data update**

            This PR contains updated GeoJSON data from the Madrid Geoportal.

            - Data source: https://geoportal.madrid.es/IDEAM_WBGEOPORTAL/dataset.iam?id=9506daa5-e317-11ec-8359-60634c31c0aa
            - Updated: ${{ steps.check_changes.outputs.date }}
            - Files: web/*.geojson
            - Changes: +${{ steps.check_changes.outputs.additions }} / -${{ steps.check_changes.outputs.deletions }} (${{ steps.check_changes.outputs.files }} files)
          branch: data/weekly-update
          delete-branch: true
          labels: automated-update

      - name: Auto-merge approved PR
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          PR_NUMBER=$(gh pr list --state open --label automated-update --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "No automated-update PR found to merge"
            exit 0
          fi
          
          echo "Found PR #$PR_NUMBER with automated-update label"
          
          # Wait a moment for any checks to register
          echo "Waiting for PR to be ready..."
          sleep 5
          
          # Auto-merge with squash
          gh pr merge $PR_NUMBER --squash --delete-branch
          echo "✅ PR #$PR_NUMBER merged automatically"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
