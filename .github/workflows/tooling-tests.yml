name: Tooling Tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'web/*.js'
      - 'web/index.html'
      - 'package*.json'
      - 'api/**'
      - 'vercel.json'
      - 'web/ser-rules.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tools:
    name: Updater tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check map JavaScript syntax
        run: |
          for file in web/*.js; do
            node --check "$file"
          done

      - name: Test shareable layer state
        run: node tests/test_layer_state.js



      - name: Test parking candidate adapters
        run: node tests/test_parking_candidates.js


      - name: Test parking ranking prototype
        run: node tests/test_parking_ranking.js

      - name: Test destination search helpers
        run: node tests/test_destination_search.js


      - name: Test realtime parking adapter
        run: |
          node tests/test_parking_occupancy_api.js
          node tests/test_parking_occupancy_client.js
      - name: Test parking ranking prototype
        run: node tests/test_parking_ranking.js


  parking-source-smoke:
    name: Live Madrid source smoke test
    if: github.head_ref == 'fix/parking-source-urls'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build updater image
        run: docker build -t zona-ser-update .

      - name: Run updater against live Madrid sources
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            zona-ser-update \
            bash scripts/update-data.sh

      - name: Update live ZBE snapshots
        run: bash scripts/update-zbe.sh

      - name: Validate all generated GeoJSON
        run: python3 scripts/validate_geojson.py --web-dir web



  mobile-recommendations:
    name: Mobile destination recommendations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
