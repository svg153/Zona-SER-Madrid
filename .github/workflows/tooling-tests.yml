name: Tooling Tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'web/*.js'
      - 'web/ser-rules.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tools:
    name: Updater tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check map JavaScript syntax
        run: |
          node --check web/script.js
          node --check web/parking-layers.js
